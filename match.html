<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Match Scanner Premium</title>
<meta content="Match Scanner - analisi statistiche pre-match" name="description"/>
<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel2:#fbfdff;
  --line:#dde6f0;
  --text:#0f172a;
  --muted:#64748b;
  --blue:#2563eb;
  --green:#0f9f6e;
  --purple:#7c3aed;
  --amber:#d99110;
  --red:#dc4c64;
  --shadow:0 14px 34px rgba(15,23,42,.08);
  --shadow-soft:0 8px 20px rgba(15,23,42,.05);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:
radial-gradient(circle at 12% 6%,rgba(37,99,235,.10),transparent 24%),
radial-gradient(circle at 90% 12%,rgba(124,58,237,.08),transparent 24%),
radial-gradient(circle at 82% 86%,rgba(15,159,110,.08),transparent 20%),
linear-gradient(180deg,#f7faff 0%,#eef3f8 100%);
color:var(--text)}
body{padding:28px}
.container{max-width:1360px;margin:0 auto}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  margin-bottom:18px;
}
.brand{
  display:flex;align-items:center;gap:12px;font-size:22px;font-weight:950;letter-spacing:-.7px;
}
.brandIcon{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#2563eb 0%,#0f9f6e 100%);
  box-shadow:0 12px 20px rgba(37,99,235,.18);
  position:relative;
}
.brandIcon:before,.brandIcon:after{
  content:"";position:absolute;bottom:9px;border-radius:999px;background:#fff;
}
.brandIcon:before{left:10px;width:6px;height:14px;opacity:.9}
.brandIcon:after{left:21px;width:6px;height:21px}
.topActions{display:flex;align-items:center;gap:10px}
.softBtn{
  border:1px solid var(--line);background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px);border-radius:999px;padding:10px 14px;
  font-size:12px;font-weight:850;color:#334155;box-shadow:var(--shadow-soft)
}

.hero{
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:18px;
  margin-bottom:18px;
}
.heroMain{
  position:relative;overflow:hidden;border-radius:30px;padding:28px 28px 24px;
  background:
    radial-gradient(circle at 14% 18%, rgba(125,211,252,.22), transparent 24%),
    radial-gradient(circle at 84% 18%, rgba(15,159,110,.17), transparent 22%),
    radial-gradient(circle at 78% 80%, rgba(124,58,237,.18), transparent 22%),
    linear-gradient(135deg,#0f172a 0%,#122447 52%,#1d4ed8 100%);
  color:#fff;box-shadow:0 24px 50px rgba(15,23,42,.18);
}
.heroMain:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  right:-90px;top:-110px;background:radial-gradient(circle,rgba(125,211,252,.25) 0%, rgba(125,211,252,0) 70%);
}
.eyebrow{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#dbeafe;
}
.eyebrowDot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.15)}
.heroTitle{position:relative;z-index:1;margin:18px 0 0;font-size:clamp(40px,5vw,68px);line-height:.94;letter-spacing:-2px;font-weight:980}
.heroTitle .accent{color:#93c5fd}
.heroSub{position:relative;z-index:1;margin-top:14px;max-width:820px;color:#d7e1ee;font-size:15px;line-height:1.55;font-weight:550}
.heroChips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.heroChip{
  display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);
  color:#fff;font-size:12px;font-weight:850
}
.heroStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.statCard{
  background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  border:1px solid var(--line);border-radius:24px;padding:18px;
  box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;justify-content:center
}
.statLabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.statValue{font-size:32px;font-weight:980;letter-spacing:-1px;margin-top:8px;line-height:1}
.statHelp{margin-top:8px;font-size:12px;color:#475569;line-height:1.45;font-weight:650}
.blue{color:var(--blue)} .green{color:var(--green)} .purple{color:var(--purple)} .red{color:var(--red)} .amber{color:var(--amber)}

.sectionTitle{font-size:22px;font-weight:950;letter-spacing:-.6px;margin:0}
.sectionSub{margin-top:4px;font-size:13px;color:var(--muted);font-weight:600}

.sectionBox{
  background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px
}

.marketGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:18px}
.marketCard{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  border:1px solid var(--line);border-radius:22px;padding:18px 16px;box-shadow:var(--shadow-soft);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.marketCard:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(15,23,42,.10)}
.marketCard.active{border-color:#adc7eb;transform:translateY(-3px);box-shadow:0 18px 34px rgba(15,23,42,.12)}
.marketCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#cbd5e1}
.marketCard[data-filter="all"].active:before{background:var(--blue)}
.marketCard[data-filter="over"].active:before{background:var(--blue)}
.marketCard[data-filter="goal"].active:before{background:var(--purple)}
.marketCard[data-filter="fav"].active:before{background:var(--amber)}
.marketCard[data-filter="under"].active:before{background:var(--green)}
.marketCard[data-filter="nobet"].active:before{background:var(--red)}
.marketCardTitle{font-size:13px;font-weight:950;letter-spacing:.8px;text-transform:uppercase}
.marketCardNum{font-size:34px;font-weight:980;letter-spacing:-1px;margin-top:12px;line-height:1}
.marketCardHint{font-size:12px;color:var(--muted);font-weight:650;margin-top:8px;line-height:1.35}

.topGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.topMatch{
  position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow-soft);
}
.topMatch:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#2563eb 0%,#7c3aed 60%,#0f9f6e 100%)}
.topTime{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.topTeams{margin-top:10px;font-size:20px;font-weight:950;letter-spacing:-.5px;line-height:1.12}
.topReco{margin-top:14px;font-size:16px;font-weight:950;color:#0f9f6e;line-height:1.15}
.topFoot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:#475569;font-weight:700}

.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:18px}
.search{
  flex:1;min-width:240px;border:1px solid var(--line);background:#fff;border-radius:16px;
  padding:13px 14px;font-size:14px;box-shadow:var(--shadow-soft);outline:none
}
.listMeta{font-size:12px;color:var(--muted);font-weight:700}

.listWrap{margin-top:16px;display:grid;gap:12px}
.matchCard{
  display:grid;grid-template-columns:110px minmax(0,1.5fr) 1fr 100px 115px auto;
  gap:14px;align-items:center;padding:18px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-soft);cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.matchCard:hover{transform:translateY(-2px);box-shadow:0 16px 28px rgba(15,23,42,.10);border-color:#bcd0e6}
.timePill{justify-self:start;padding:10px 12px;border-radius:999px;background:#eef5ff;color:#174f91;font-size:12px;font-weight:900}
.teamsBlock{min-width:0}
.teamsName{font-size:18px;font-weight:950;letter-spacing:-.4px;line-height:1.16}
.teamsLeague{margin-top:5px;font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{
  display:inline-flex;align-items:center;padding:8px 11px;border-radius:999px;font-size:11px;
  font-weight:900;letter-spacing:.35px;border:1px solid transparent
}
.badge.over{color:#1d4ed8;background:#eef5ff;border-color:#c8daf9}
.badge.goal{color:#6d28d9;background:#f5f0ff;border-color:#ddd0fb}
.badge.favorite{color:#a96308;background:#fff7e7;border-color:#f0dcad}
.badge.under{color:#087a55;background:#eefaf5;border-color:#c8eadc}
.badge.nobet{color:#b4233d;background:#fff2f4;border-color:#f2cad2}
.recoMain{font-size:14px;font-weight:900;color:#0f9f6e;line-height:1.25}
.recoSub{margin-top:4px;font-size:12px;color:#475569;font-weight:700;line-height:1.35}
.scoreBox{text-align:center}
.scoreN{font-size:28px;font-weight:980;letter-spacing:-1px;line-height:1}
.scoreLbl{margin-top:5px;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.confPill{padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;justify-self:start}
.conf-alta{background:#eaf8f2;color:#087a55;border:1px solid #bfe6d7}
.conf-media-alta{background:#eef5ff;color:#1d4ed8;border:1px solid #c9daf7}
.conf-media{background:#fff8e8;color:#a96308;border:1px solid #efd49a}
.conf-bassa{background:#fff2f4;color:#b4233d;border:1px solid #efc5cd}

.emptyState{padding:34px 18px;text-align:center;background:#fff;border:1px dashed #c7d4e3;border-radius:24px;color:#64748b;font-weight:700}

.detailView{display:none;margin-top:18px}
.detailView.show{display:block}
.backBtn{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;border:0;background:#fff;
  border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;box-shadow:var(--shadow-soft)
}
.detailHero{
  background:linear-gradient(135deg,#0f172a 0%,#122447 50%,#1d4ed8 100%);
  color:#fff;border-radius:28px;padding:22px;box-shadow:0 20px 42px rgba(15,23,42,.18)
}
.detailMeta{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#dbeafe}
.detailName{margin-top:10px;font-size:34px;font-weight:980;line-height:1.02;letter-spacing:-1.3px}
.detailReco{
  margin-top:16px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  border-radius:20px;padding:16px
}
.detailRecoLabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:#dbeafe}
.detailRecoValue{font-size:24px;font-weight:980;margin-top:5px}
.detailRecoHelp{margin-top:7px;font-size:13px;color:#dbe3f0;line-height:1.45;font-weight:650}

.detailGrid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;margin-top:18px}
.detailCard{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow-soft)
}
.detailCardTitle{font-size:15px;font-weight:950;letter-spacing:-.2px;margin-bottom:14px}
.statsGrid{display:grid;gap:10px}
.statsRow{display:grid;grid-template-columns:minmax(170px,1.2fr) 1fr 1fr;gap:10px;align-items:center;padding:12px;border:1px solid #e3ebf3;border-radius:16px;background:linear-gradient(180deg,#fff 0%,#fbfdff 100%)}
.statsHead{background:#eef5ff;border-color:#d5e2f3;font-size:12px;font-weight:900;color:#334155}
.statLbl{font-size:12px;font-weight:800;color:#475569}
.statVal{font-size:15px;font-weight:950;color:#0f172a}
.notice{
  padding:14px;border-radius:16px;background:#f8fbff;border:1px solid #dde7f2;color:#334155;font-size:13px;line-height:1.55;font-weight:650
}

.footerNote{margin-top:22px;text-align:center;font-size:12px;color:#64748b;font-weight:650}

@media(max-width:1200px){
  .marketGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .topGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .matchCard{grid-template-columns:100px minmax(0,1.35fr) 1fr 90px 105px auto}
}
@media(max-width:950px){
  .hero{grid-template-columns:1fr}
  .detailGrid{grid-template-columns:1fr}
  .matchCard{grid-template-columns:1fr;gap:12px}
  .scoreBox,.confPill{justify-self:start;text-align:left}
}
@media(max-width:720px){
  body{padding:16px}
  .marketGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topGrid{grid-template-columns:1fr}
  .heroTitle{font-size:38px;line-height:1}
  .detailName{font-size:28px}
  .statsRow{grid-template-columns:1.2fr 1fr 1fr}
}

/* ===== DETAIL PAGE THEME ===== */

:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --panel-2:#fbfdff;
  --line:#dde6f0;
  --text:#0f172a;
  --muted:#64748b;
  --blue:#2563eb;
  --blue-soft:#eef5ff;
  --green:#0f9f6e;
  --green-soft:#eefaf5;
  --red:#dc4c64;
  --red-soft:#fff2f4;
  --amber:#d99110;
  --amber-soft:#fff8e8;
  --purple:#7c3aed;
  --purple-soft:#f5f0ff;
  --shadow:0 16px 36px rgba(15,23,42,.08);
  --shadow-soft:0 8px 20px rgba(15,23,42,.05);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
background:
  radial-gradient(circle at 10% 8%, rgba(37,99,235,.10), transparent 22%),
  radial-gradient(circle at 90% 14%, rgba(124,58,237,.08), transparent 24%),
  radial-gradient(circle at 82% 84%, rgba(15,159,110,.07), transparent 20%),
  linear-gradient(180deg,#f7faff 0%,#eef3f8 100%);
}
body{padding:26px}
.container{max-width:1420px;margin:0 auto}
.hero{
  position:relative;overflow:hidden;border-radius:30px;padding:24px 24px 22px;
  background:
    radial-gradient(circle at 12% 18%, rgba(125,211,252,.22), transparent 24%),
    radial-gradient(circle at 86% 16%, rgba(15,159,110,.18), transparent 22%),
    radial-gradient(circle at 80% 86%, rgba(124,58,237,.18), transparent 22%),
    linear-gradient(135deg,#0f172a 0%,#13254a 52%,#1d4ed8 100%);
  color:#fff;box-shadow:0 24px 48px rgba(15,23,42,.18);margin-bottom:18px;
}
.hero:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:24px 24px;opacity:.24;pointer-events:none;
}
.heroTop{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#dbeafe;
}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.15)}
.heroTitle{margin-top:18px;font-size:clamp(34px,4vw,58px);line-height:.95;font-weight:980;letter-spacing:-1.7px}
.heroSub{margin-top:12px;max-width:960px;color:#d9e4ef;font-size:15px;line-height:1.6;font-weight:550}
.heroMeta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.metaChip{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:850}
.heroAside{
  min-width:300px;max-width:360px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  border-radius:22px;padding:16px 16px 14px;backdrop-filter:blur(8px);box-shadow:0 14px 30px rgba(15,23,42,.12)
}
.heroAsideLabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.9px;color:#dbeafe}
.heroAsideValue{margin-top:8px;font-size:28px;font-weight:980;letter-spacing:-.7px}
.heroAsideSub{margin-top:8px;font-size:13px;color:#d9e4ef;line-height:1.5}
.pageGrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.9fr);gap:18px}
.stack{display:grid;gap:18px}
.card{
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)
}
.cardTitle{margin:0;font-size:22px;font-weight:970;letter-spacing:-.7px}
.cardSub{margin-top:6px;font-size:13px;color:var(--muted);font-weight:650;line-height:1.45}
.segmentWrap{margin-top:18px}
.segmentBar{display:flex;height:40px;border-radius:14px;overflow:hidden;background:#edf2f7;box-shadow:inset 0 0 0 1px #e2e8f0}
.segment{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:950;color:#fff}
.seg1{background:linear-gradient(180deg,#4aa6ea 0%,#2d89d1 100%)}
.segX{background:linear-gradient(180deg,#f4cb5a 0%,#dca62d 100%);color:#5a4300}
.seg2{background:linear-gradient(180deg,#ff6a87 0%,#ea4568 100%)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:#475569;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend1{background:#3e9bdd} .legendX{background:#f0c44d} .legend2{background:#f45b79}
.note{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f8fbff;border:1px solid #dce7f2;color:#475569;font-size:12px;line-height:1.5;font-weight:650}

.formGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.chartWrap{margin-top:16px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);border:1px solid #e2ebf3;border-radius:18px;padding:12px}
.chartLegend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:13px;font-weight:750;color:#475569;flex-wrap:wrap}
.chartLegend span{display:inline-flex;align-items:center;gap:7px} .c1,.c2{width:12px;height:12px;border-radius:3px;display:inline-block} .c1{background:#3e9bdd} .c2{background:#f45b79}
.summaryPills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{padding:9px 12px;border-radius:999px;border:1px solid #dbe5ef;background:linear-gradient(180deg,#fff 0%,#f9fbfe 100%);font-size:12px;font-weight:850;color:#334155;box-shadow:var(--shadow-soft)}

.table{width:100%;border-collapse:separate;border-spacing:0 10px;margin-top:14px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:0 12px 6px;font-weight:900}
.table td{padding:12px;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);border-top:1px solid #e4ecf3;border-bottom:1px solid #e4ecf3;font-size:14px;font-weight:700;color:#0f172a}
.table td:first-child{border-left:1px solid #e4ecf3;border-top-left-radius:14px;border-bottom-left-radius:14px}
.table td:last-child{border-right:1px solid #e4ecf3;border-top-right-radius:14px;border-bottom-right-radius:14px}
.resultTag{display:inline-flex;min-width:36px;justify-content:center;padding:6px 8px;border-radius:8px;font-size:12px;font-weight:900}
.W{background:#eaf8f2;color:#087a55}
.D{background:#fff8e8;color:#a96308}
.L{background:#fff2f4;color:#b4233d}

.dualTable{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.microTable{width:100%;border-collapse:collapse;margin-top:12px}
.microTable th,.microTable td{padding:10px 8px;border-bottom:1px solid #e8eef5;font-size:13px}
.microTable th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.microTable td:last-child{text-align:right;font-weight:900}

/* ===== GLOBAL DYNAMIC SOCIAL CARDS ===== */
.card{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(37,99,235,.035),transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#fbfdff 100%) !important;
  border:1px solid #dfe8f1 !important;
  border-radius:26px !important;
  box-shadow:0 14px 32px rgba(15,23,42,.07) !important;
  transition:
    transform .18s cubic-bezier(.2,.8,.2,1),
    box-shadow .18s ease,
    border-color .18s ease,
    background .18s ease !important;
}
.card::before{
  content:"";
  position:absolute;
  left:0;top:0;right:0;
  height:4px;
  background:linear-gradient(90deg,#2563eb 0%,#7c3aed 52%,#0f9f6e 100%);
  opacity:.82;
  transition:height .18s ease,opacity .18s ease;
}
.card::after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-90px;top:-105px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.09),rgba(37,99,235,0) 70%);
  pointer-events:none;
  transition:transform .25s ease,opacity .25s ease;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#c8d8e8 !important;
  box-shadow:0 22px 44px rgba(15,23,42,.11) !important;
}
.card:hover::before{
  height:5px;
  opacity:1;
}
.card:hover::after{
  transform:scale(1.12);
}

.cardTitle{
  position:relative;
  z-index:1;
  font-size:22px !important;
  font-weight:980 !important;
  letter-spacing:-.7px !important;
  color:#0f172a !important;
}
.cardSub{
  position:relative;
  z-index:1;
  color:#64748b !important;
  font-size:13px !important;
  font-weight:650 !important;
}

/* mini cards */
.metricCard,
.snapMetric,
.marketRow,
.timingSlotCard,
.analysisBlock,
.resultsTeamCard,
.resultRow2,
.cornerValBox,
.infoRow{
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    border-color .16s ease,
    background .16s ease;
}
.metricCard:hover,
.snapMetric:hover,
.marketRow:hover,
.timingSlotCard:hover,
.analysisBlock:hover,
.cornerValBox:hover{
  transform:translateY(-2px);
  border-color:#cbd9e8 !important;
  box-shadow:0 12px 24px rgba(15,23,42,.07) !important;
}

/* Info Match */
.card:has(.infoList) .infoRow{
  border-bottom:0 !important;
  background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);
  border:1px solid #e2eaf2;
  border-radius:16px;
  padding:13px 14px !important;
  margin-bottom:9px;
}
.card:has(.infoList) .infoRow:hover{
  transform:translateX(3px);
  border-color:#c9d9e9;
  box-shadow:0 8px 18px rgba(15,23,42,.05);
}
.card:has(.infoList) .infoRow .k{
  color:#64748b !important;
  font-weight:900 !important;
  text-transform:uppercase;
  letter-spacing:.65px;
  font-size:10px !important;
}
.card:has(.infoList) .infoRow .v{
  font-size:15px !important;
  font-weight:950 !important;
  color:#0f172a !important;
}

/* Market signals */
.marketRow{
  position:relative;
  overflow:hidden;
  border-radius:18px !important;
  background:
    radial-gradient(circle at 100% 0%,rgba(15,159,110,.05),transparent 24%),
    linear-gradient(180deg,#ffffff 0%,#fbfdff 100%) !important;
}
.marketRow::before{
  content:"";
  position:absolute;
  left:0;top:10px;bottom:10px;width:4px;
  border-radius:999px;
  background:linear-gradient(180deg,#2563eb 0%,#7c3aed 100%);
}
.marketName{
  font-size:15px !important;
  font-weight:980 !important;
  letter-spacing:-.25px;
}
.marketStrength{
  box-shadow:0 5px 12px rgba(15,23,42,.05);
}

/* Results section */
.resultsTeamCard{
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.resultsTeamCard:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 34px rgba(15,23,42,.09);
  border-color:#cbd9e8;
}
.resultRow2:hover{
  transform:translateX(4px) !important;
}

/* Goal timing */
.timingPanel{
  position:relative;
  overflow:hidden;
}
.timingPanel::after{
  content:"";
  position:absolute;
  right:-45px;top:-45px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(15,159,110,.08),rgba(15,159,110,0) 70%);
}
.timingSlotCard{
  background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%) !important;
}
.timingSlotCard:hover{
  transform:translateX(3px);
  box-shadow:0 8px 18px rgba(15,23,42,.05);
}

/* Home / Away */
.teamSnapshot{
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.teamSnapshot:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 34px rgba(15,23,42,.09);
  border-color:#cad8e6;
}
.snapMetric{
  box-shadow:0 5px 12px rgba(15,23,42,.035);
}
.snapMetric:hover{
  transform:translateY(-3px);
}
.snapshotBadge{
  box-shadow:0 7px 14px rgba(37,99,235,.07);
}

/* H2H */
.metricCard{
  position:relative;
  overflow:hidden;
}
.metricCard::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:3px;
  background:#cbd5e1;
}
.metricCard:nth-child(1)::before{background:#2563eb}
.metricCard:nth-child(2)::before{background:#7c3aed}
.metricCard:nth-child(3)::before{background:#0f9f6e}
.metricCard:nth-child(4)::before{background:#d99110}

/* Standings */
.rankTable tr{
  transition:background .14s ease,transform .14s ease;
}
.rankTable tbody tr:hover td{
  background:#f7faff;
}
.rankTable tr.highlight-home td{
  background:linear-gradient(90deg,#eaf2ff 0%,#f8fbff 100%) !important;
}
.rankTable tr.highlight-away td{
  background:linear-gradient(90deg,#f7f0ff 0%,#fcfaff 100%) !important;
}

/* Analysis */
.analysisBlock{
  position:relative;
  overflow:hidden;
}
.analysisBlock::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#2563eb 0%,#0f9f6e 100%);
}
.analysisBlock:hover{
  transform:translateX(3px);
}

/* Numeri più social */
.metricValue,
.snapMetricValue,
.scoreN,
.marketCardNum,
.statValue,
.timingStatVal{
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}

/* subtle entrance */
@keyframes riseIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.card{
  animation:riseIn .42s ease both;
}
.stack .card:nth-child(1){animation-delay:.02s}
.stack .card:nth-child(2){animation-delay:.05s}
.stack .card:nth-child(3){animation-delay:.08s}
.stack .card:nth-child(4){animation-delay:.11s}
.stack .card:nth-child(5){animation-delay:.14s}

/* mobile: reduce motion */
@media(max-width:760px){
  .card:hover,
  .metricCard:hover,
  .snapMetric:hover,
  .marketRow:hover,
  .timingSlotCard:hover,
  .analysisBlock:hover,
  .resultsTeamCard:hover,
  .resultRow2:hover,
  .teamSnapshot:hover{
    transform:none !important;
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
  }
}

/* ===== RADAR COMPARATIVO DINAMICO ===== */
.radarCompareCard{
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 15% 10%,rgba(34,211,238,.07),transparent 24%),
    radial-gradient(circle at 95% 0%,rgba(124,58,237,.09),transparent 25%),
    linear-gradient(180deg,#ffffff 0%,#f8fbff 100%)!important;
}
.radarMount{display:flex;flex-direction:column;gap:12px;min-height:100%}
.radarHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.radarEyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:10px;font-weight:950;letter-spacing:.9px;text-transform:uppercase;border:1px solid #dbeafe}
.radarEyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.10)}
.radarTitle{margin:8px 0 0;font-size:22px;font-weight:1000;letter-spacing:-.7px;color:#0f172a}
.radarSub{margin-top:5px;color:#64748b;font-size:12px;line-height:1.45;font-weight:700}
.radarScaleBadge{flex:0 0 auto;padding:8px 10px;border-radius:12px;background:#0f172a;color:#fff;font-size:10px;font-weight:900;letter-spacing:.7px}

.radarBody{display:flex;flex-direction:column;align-items:center;gap:12px}
.radarStage{
  position:relative;
  width:min(100%,620px);
  height:clamp(340px,30vw,390px);
  min-height:340px;
  padding:0;
  border-radius:18px;
  background:
    radial-gradient(circle at 50% 43%,rgba(37,99,235,.17),transparent 36%),
    linear-gradient(180deg,#0b1630 0%,#122654 100%);
  border:0;
  box-shadow:0 12px 24px rgba(15,23,42,.08);
  margin:0 auto;
}
.radarStage svg{display:block;width:100%;height:100%;overflow:visible}
.radarGrid{fill:none;stroke:rgba(226,232,240,.16);stroke-width:1}
.radarAxis{stroke:rgba(226,232,240,.14);stroke-width:1}
.radarAxisLabel{fill:#e5edf8;font-size:14px;font-weight:900;text-anchor:middle;letter-spacing:-.15px}
.radarPolyHome{fill:rgba(56,189,248,.20);stroke:#54c5ff;stroke-width:3.2;filter:drop-shadow(0 0 12px rgba(84,197,255,.32))}
.radarPolyAway{fill:rgba(244,63,94,.18);stroke:#ff6387;stroke-width:3.2;filter:drop-shadow(0 0 12px rgba(255,99,135,.28))}
.radarPointHome{fill:#e8f8ff;stroke:#54c5ff;stroke-width:3}
.radarPointAway{fill:#fff0f4;stroke:#ff6387;stroke-width:3}

.radarLegend{
  width:min(100%,620px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.radarTeam{padding:11px 12px;border-radius:16px;border:1px solid #e1eaf3;background:#fff;box-shadow:0 8px 16px rgba(15,23,42,.03)}
.radarTeamTop{display:flex;align-items:center;gap:8px;color:#0f172a;font-size:13px;font-weight:950}
.radarDot{width:10px;height:10px;border-radius:4px;display:inline-block}
.radarDot.home{background:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.10)}
.radarDot.away{background:#f43f5e;box-shadow:0 0 0 4px rgba(244,63,94,.09)}
.radarQuickGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}
.radarQuickItem{padding:8px 9px;border-radius:12px;background:#f7faff;border:1px solid #e5edf5;text-align:left}
.radarQuickItem span{display:block;color:#718096;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.65px}
.radarQuickItem b{display:block;margin-top:4px;color:#0f172a;font-size:13px;font-weight:1000;line-height:1.2}
.radarFoot{width:min(100%,620px);padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;color:#64748b;font-size:10px;line-height:1.4;font-weight:720;text-align:center}

@media(max-width:1200px){
  .radarStage{width:min(100%,600px);height:clamp(320px,32vw,370px);min-height:320px;padding:0}
  .radarLegend,.radarFoot{width:min(100%,600px)}
}
@media(max-width:950px){
  .radarStage{width:100%;height:clamp(310px,56vw,360px);min-height:310px;padding:0}
  .radarLegend,.radarFoot{width:100%}
}
@media(max-width:760px){
  .radarHead{align-items:flex-start}
  .radarStage{height:300px;min-height:300px;padding:0}
  .radarAxisLabel{font-size:11px}
  .radarLegend{grid-template-columns:1fr}
  .radarQuickGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ===== DARK SOCIAL 2026 THEME ===== */
:root{
  --bg:#07111f!important;
  --panel:#0d1728!important;
  --panel2:#111d31!important;
  --line:rgba(148,163,184,.16)!important;
  --text:#f8fbff!important;
  --muted:#8fa3bd!important;
  --blue:#5ab8ff!important;
  --green:#45e0a5!important;
  --purple:#a78bfa!important;
  --amber:#f4c15d!important;
  --red:#ff6b86!important;
  --shadow:0 20px 50px rgba(0,0,0,.32)!important;
  --shadow-soft:0 12px 28px rgba(0,0,0,.22)!important;
}
html,body{
  background:
    radial-gradient(circle at 12% 4%,rgba(56,189,248,.12),transparent 24%),
    radial-gradient(circle at 88% 12%,rgba(139,92,246,.13),transparent 26%),
    radial-gradient(circle at 72% 82%,rgba(16,185,129,.08),transparent 22%),

body{color:#f8fbff!important}

const teamLogoOverrides = {"Stevenage":"https://assets.footylogos.com/logos/stevenage/stevenage-logo-footylogos.svg","Luton Town":"https://assets.footylogos.com/logos/luton-town/luton-town-logo-footylogos.svg","Sporting Braga":"https://assets.footylogos.com/logos/sc-braga/sc-braga-logo-footylogos.svg","Estrela Amadora":"https://assets.footylogos.com/logos/estrela-amadora/estrela-amadora-logo-footylogos.svg"};
const logoCache = new Map();
const LOGO_CACHE_KEY='MAGICSCANNER_LOGO_CACHE_V3_OFFICIAL';

function logoNorm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(fc|cf|sc|afc|ac|calcio|club|football|futbol|fk|sk)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function canonicalLogoTeam(name){
  const raw=String(name||'').replace(/\s+/g,' ').trim();
  return (typeof teamLogoAliases!=='undefined' && teamLogoAliases[raw]) ? teamLogoAliases[raw] : raw;
}
function logoCandidates(name){
  const alias=canonicalLogoTeam(name);
  const arr=[alias,name];
  const stripped=String(alias).replace(/\b(FC|CF|SC|AFC|AC|FK|SK)\b/gi,' ').replace(/\s+/g,' ').trim(); if(stripped)arr.push(stripped);
  const expanded=String(alias).replace(/\bUtd\b/gi,'United').replace(/\bAth\.\b/gi,'Athletic').replace(/\bBor\.\b/gi,'Borussia'); if(expanded)arr.push(expanded);
  return [...new Set(arr.filter(Boolean))];
}
function fallbackTeamLogo(name){
  const initials=String(name||'?').split(/\s+/).filter(Boolean).slice(0,3).map(x=>x[0]).join('').toUpperCase().slice(0,3)||'?';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="#102238" stroke="#315776" stroke-width="4"/><text x="48" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#b9d7eb">${initials.replace(/[&<>]/g,'')}</text></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}
function readLogoCache(){
  try{
    const fresh=JSON.parse(localStorage.getItem(LOGO_CACHE_KEY)||'{}')||{};
    const legacy=JSON.parse(localStorage.getItem('MAGICSCANNER_LOGO_CACHE')||'{}')||{};
    for(const [k,v] of Object.entries(legacy)) if(!fresh[k] && v && !String(v).startsWith('data:image')) fresh[k]=v;
    return fresh;
  }catch{return{}}
}
function saveLogoCache(name,url){
  if(!url || String(url).startsWith('data:image')) return;
  try{const c=readLogoCache();c[name]=url;localStorage.setItem(LOGO_CACHE_KEY,JSON.stringify(c))}catch{}
}
async function wikiTeamLogo(name,league=''){
  const canonical=canonicalLogoTeam(name);
  if(canonical.length<4) return '';
  const queries=[`${canonical} football club`, `${canonical} FC`];
  for(const q of queries){
    try{
      const u='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrnamespace=0&gsrlimit=5&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages&piprop=thumbnail&pithumbsize=180&format=json&origin=*';
      const r=await fetch(u); if(!r.ok) continue;
      const j=await r.json(); const pages=Object.values(j?.query?.pages||{});
      const nn=logoNorm(canonical);
      const tokens=nn.split(' ').filter(x=>x.length>=4);
      const ranked=pages.filter(p=>p?.thumbnail?.source).sort((a,b)=>{
        const an=logoNorm(a.title),bn=logoNorm(b.title);
        const as=(an===nn?100:0)+tokens.filter(t=>an.includes(t)).length*10;
        const bs=(bn===nn?100:0)+tokens.filter(t=>bn.includes(t)).length*10;
        return bs-as;
      });
      const hit=ranked[0]; if(hit?.thumbnail?.source) return hit.thumbnail.source;
    }catch(e){}
  }
  return '';
}
async function getOfficialTeamLogo(name,league=''){
  const cacheKey=canonicalLogoTeam(name);
  if(logoCache.has(cacheKey)) return logoCache.get(cacheKey);
  if(typeof teamLogoOverrides!=='undefined' && (teamLogoOverrides[name]||teamLogoOverrides[cacheKey])){
    const u=teamLogoOverrides[name]||teamLogoOverrides[cacheKey]; logoCache.set(cacheKey,u); saveLogoCache(cacheKey,u); return u;
  }
  const persisted=readLogoCache()[cacheKey]||readLogoCache()[name];
  if(persisted && !String(persisted).startsWith('data:image')){logoCache.set(cacheKey,persisted);return persisted}
  for(const q of logoCandidates(name)){
    try{
      const r=await fetch('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(q));
      if(!r.ok) continue; const data=await r.json(); const teams=Array.isArray(data?.teams)?data.teams:[];
      const qn=logoNorm(q), nn=logoNorm(cacheKey);
      const candidates=teams.filter(t=>(t.strSport||'').toLowerCase()==='soccer');
      const best=candidates.find(t=>logoNorm(t.strTeam)===qn||logoNorm(t.strTeam)===nn||logoNorm(t.strAlternate||'').includes(qn))||candidates[0]||teams[0];
      const badge=best?.strBadge||''; if(badge){logoCache.set(cacheKey,badge);saveLogoCache(cacheKey,badge);return badge}
    }catch(e){}

function fallbackRadarSource(m){
  const basic=m.basic||{};
  const [ppgH,ppgA]=firstSecondNumber(basic["Punti per partita"]);
  const [gfH,gfA]=firstSecondNumber(basic["Gol fatti"]);
  const [gaH,gaA]=firstSecondNumber(basic["Gol subiti"]);
  const [csH,csA]=firstSecondNumber(basic["Senza subire"]);
  return {
    home:{overallPpg:ppgH,splitPpg:ppgH,gf:gfH,ga:gaH,cs:csH,formPts:ppgH*4,formGames:4},
    away:{overallPpg:ppgA,splitPpg:ppgA,gf:gfA,ga:gaA,cs:csA,formPts:ppgA*4,formGames:4}
  };
}
function radarIndexes(src){
  return [
    clamp100((src.overallPpg/3)*100),                          // rendimento
    clamp100(100-(Math.min(src.ga,3.5)/3.5)*100),             // solidità
    clamp100((Math.min(src.gf,3)/3)*100),                      // realizzazione
    clamp100(src.cs),                                          // porta inviolata
    clamp100((src.splitPpg/3)*100),                            // fattore casa/trasferta
    clamp100((src.formPts/(Math.max(src.formGames,1)*3))*100)  // forma
  ];
}
function radarPoint(cx,cy,r,angleDeg,value){
  const a=(angleDeg-90)*Math.PI/180;
  const rr=r*(value/100);
  return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr];
}
function radarPolygon(cx,cy,r,values){
  return values.map((v,i)=>{
    const [x,y]=radarPoint(cx,cy,r,i*60,v);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function radarGridPolygon(cx,cy,r,level){
  return radarPolygon(cx,cy,r,Array(6).fill(level));
}
function renderProfileComparison(m,root){
  const mount=root.querySelector('.profileMount');
  if(!mount) return;
  const source=radarSourceData[m.id]||fallbackRadarSource(m);
  const h=radarIndexes(source.home), a=radarIndexes(source.away);
  const metrics=['Rendimento','Solidità','Realizzazione','Porta inviolata','Fattore casa/trasf.','Stato di forma'];
  const rows=metrics.map((label,i)=>{
    const hv=Math.max(0,Math.min(100,h[i]||0)), av=Math.max(0,Math.min(100,a[i]||0));
    return `<div class="profileRow"><div class="profileTeamVal">${hv}</div><div><div class="profileMetric">${esc(label)}</div><div class="profileTrack"><div class="profileHalf home"><div class="profileFill home" style="width:${hv}%"></div></div><div class="profileHalf away"><div class="profileFill away" style="width:${av}%"></div></div><div class="profileCenter"></div></div></div><div class="profileTeamVal right">${av}</div></div>`;
  }).join('');
  mount.innerHTML=`<div class="profileHead"><div><div class="profileEyebrow">Confronto profilo</div><div class="profileTitle">Confronto statistico</div><div class="profileSub">Lettura casa vs trasferta sui dati disponibili. Più immediata del radar e senza indicatori decorativi non necessari.</div></div><div class="profileScale">Indice 0–100</div></div><div class="profileRows">${rows}</div><div class="profileLegend"><span><i class="profileDot home"></i><b>${esc(m.home)}</b> · casa</span><span><i class="profileDot away"></i><b>${esc(m.away)}</b> · trasferta</span></div>`;
}

function renderRadar(m,root){
  const mount=root.querySelector('.radarMount');
  if(!mount) return;

  const source=radarSourceData[m.id]||fallbackRadarSource(m);
  const homeVals=radarIndexes(source.home);
  const awayVals=radarIndexes(source.away);
  const labels=["Rendimento","Solidità","Realizzazione","Porta inviolata","Fattore casa/trasf.","Stato di forma"];
  const cx=310,cy=205,r=178;
  const labelR=194;

  const grids=[20,40,60,80,100].map(v=>`<polygon class="radarGrid" points="${radarGridPolygon(cx,cy,r,v)}"></polygon>`).join('');
  const axes=labels.map((_,i)=>{
    const [x,y]=radarPoint(cx,cy,r,i*60,100);
    return `<line class="radarAxis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"></line>`;
  }).join('');
  const axisLabels=labels.map((label,i)=>{
    const [x,y]=radarPoint(cx,cy,labelR,i*60,100);
    const dy=i===0?-4:(i===3?10:4);
    return `<text class="radarAxisLabel" x="${x}" y="${y+dy}">${label}</text>`;
  }).join('');
  const homePts=homeVals.map((v,i)=>{
    const [x,y]=radarPoint(cx,cy,r,i*60,v);
    return `<circle class="radarPointHome" cx="${x}" cy="${y}" r="4"></circle>`;
  }).join('');
  const awayPts=awayVals.map((v,i)=>{
    const [x,y]=radarPoint(cx,cy,r,i*60,v);
    return `<circle class="radarPointAway" cx="${x}" cy="${y}" r="4"></circle>`;
  }).join('');

  mount.innerHTML=`
    <div class="radarHead">
      <div>
        <div class="radarEyebrow">Confronto profilo</div>
        <h2 class="radarTitle">Radar della partita</h2>
        <div class="radarSub">Confronto casa vs trasferta sui dati specifici disponibili per questa partita.</div>
      </div>
      <div class="radarScaleBadge">INDICE 0–100</div>
    </div>
    <div class="radarBody">
      <div class="radarStage">
        <svg viewBox="0 0 620 410" preserveAspectRatio="xMidYMid meet" aria-label="Radar comparativo ${esc(m.home)} vs ${esc(m.away)}">
          ${grids}${axes}${axisLabels}
          <polygon class="radarPolyHome" points="${radarPolygon(cx,cy,r,homeVals)}"></polygon>
          <polygon class="radarPolyAway" points="${radarPolygon(cx,cy,r,awayVals)}"></polygon>
          ${homePts}${awayPts}
        </svg>
      </div>
      <div class="radarLegend">
        <div class="radarTeam">
          <div class="radarTeamTop"><i class="radarDot home"></i>${esc(m.home)} · casa</div>
          <div class="radarQuickGrid">
            <div class="radarQuickItem"><span>Rendimento</span><b>${homeVals[0]}</b></div>
            <div class="radarQuickItem"><span>Solidità</span><b>${homeVals[1]}</b></div>
            <div class="radarQuickItem"><span>Realizzazione</span><b>${homeVals[2]}</b></div>
          </div>
        </div>
        <div class="radarTeam">
          <div class="radarTeamTop"><i class="radarDot away"></i>${esc(m.away)} · trasferta</div>
          <div class="radarQuickGrid">
            <div class="radarQuickItem"><span>Porta inviolata</span><b>${awayVals[3]}</b></div>
            <div class="radarQuickItem"><span>Fattore trasf.</span><b>${awayVals[4]}</b></div>
            <div class="radarQuickItem"><span>Stato forma</span><b>${awayVals[5]}</b></div>
          </div>
        </div>
      </div>
      <div class="radarFoot">Indice comparativo interno, non percentuale ufficiale SoccerSTATS. Il radar è centrato e dimensionato per restare protagonista senza rompere le proporzioni del layout.</div>
    </div>
  `;
}

let SERVER_MATCHDAYS={};
let SERVER_DETAILS={};

function msNormId(v){
  return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function showMatchError(title,message){
  const el=document.getElementById('genericDetail');
  if(!el) return;
  el.style.display='block';
  el.innerHTML=`<div class="detailCard" style="max-width:900px;margin:34px auto"><div class="detailCardTitle">${esc(title)}</div><div class="notice">${esc(message)}</div><div style="margin-top:14px"><a class="v3back" href="index.html">← Torna alla home</a></div></div>`;
}

async function fetchServerMatch(id){
  const r=await fetch('/api/match/'+encodeURIComponent(id),{cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`API partita HTTP ${r.status}`);
  const data=await r.json();
  if(!data || !data.ok || !data.match) return null;
  return data;
}

function getLocalImportedMatch(id){
  const wanted=msNormId(id);
  const candidates=[];
  try{
    const days=JSON.parse(localStorage.getItem('MAGICSCANNER_MATCHDAYS')||'{}')||{};
    for(const pack of Object.values(days)) if(pack&&Array.isArray(pack.matches)) candidates.push(...pack.matches);
  }catch{}
  try{
    const today=JSON.parse(localStorage.getItem('MAGICSCANNER_MATCHDAY')||'{}')||{};
    if(Array.isArray(today.matches)) candidates.push(...today.matches);
  }catch{}
  return candidates.find(x=>msNormId(x?.id)===wanted||msNormId(`${x?.home||''}-${x?.away||''}`)===wanted)||null;
}

async function initMatchPage(){
  const el=document.getElementById('genericDetail');
  if(el){
    el.style.display='block';
    el.innerHTML='<div class="detailCard" style="max-width:900px;margin:34px auto"><div class="detailCardTitle">Caricamento partita…</div><div class="notice">Sto recuperando la scheda dal server MagicScanner.</div></div>';
  }
  try{
    const id=new URLSearchParams(location.search).get('id');
    if(!id){ showMatchError('Partita non trovata','Manca l’identificativo della partita. Torna alla home e seleziona un match.'); return; }

    let serverPack=null;
    try{ serverPack=await fetchServerMatch(id); }catch(e){ console.warn('API match non disponibile',e); }

    const staticMatch=matches.find(x=>msNormId(x.id)===msNormId(id));
    const localMatch=getLocalImportedMatch(id);
    const m=serverPack?.match || localMatch || staticMatch || null;
    if(!m){ showMatchError('Partita non trovata',`Non trovo “${id}” nell’archivio pubblicato. Torna alla home e riapri la partita.`); return; }
    if(serverPack?.date && !m.date_label){
      const [yy,mm,dd]=String(serverPack.date).split('-').map(Number);
      const dt=new Date(yy,(mm||1)-1,dd||1,12);
      if(!isNaN(dt)) m.date_label=dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }

    document.title=`${m.home} vs ${m.away} · MagicScanner`;

    let importedDetail=serverPack?.detail || null;
    if(!importedDetail){
      let localImported={};
      try{localImported=JSON.parse(localStorage.getItem('MAGICSCANNER_IMPORTED_DETAILS')||'{}')||{}}catch{}
      importedDetail=localImported[m.id] || localImported[id] || (window.IMPORTED_DETAILS||{})[m.id] || (window.IMPORTED_DETAILS||{})[id] || null;
      if(!importedDetail){
        const all=Object.values({...localImported,...(window.IMPORTED_DETAILS||{})});
        importedDetail=all.find(d=>d&&msNormId(`${d.home||''}-${d.away||''}`)===msNormId(`${m.home||''}-${m.away||''}`))||null;
      }
    }

    if(importedDetail) showAutoDetail(m,importedDetail);
    else showGeneric(m);
    window.scrollTo(0,0);
  }catch(e){
    console.error('Errore apertura scheda partita',e);
    showMatchError('Errore caricamento scheda',e && e.message ? e.message : 'Errore imprevisto durante il caricamento della partita.');
  }
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initMatchPage);
else initMatchPage();
</script></body>
